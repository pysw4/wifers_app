services:
  # ---- Python API Backend ----
  - type: web
    name: wifers-app-api
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT --log-level info"
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONUNBUFFERED
        value: "1"
    buildFilter:
      ignoredPaths:
        - test
        - lib
        - android
        - ios
        - windows
        - linux
        - macos
        - web
        - build

  # ---- Flutter Web Frontend (Static Site) ----
  - type: web
    name: wifers-app-web
    runtime: static
    buildCommand: "flutter pub get && flutter build web --release"
    staticPublishPath: build/web
    plan: free